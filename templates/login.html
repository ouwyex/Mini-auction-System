{% extends "base.html" %}
{% block title %}Log in | Mini Auction{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Welcome back</p><h1>Log in</h1><p>Your next great find might be just a bid away.</p></div></div>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Email <input type="email" name="email" required autocomplete="email" value="{{ request.form.get('email', '') }}"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Log in</button>
</form>{% endblock %}
