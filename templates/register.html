{% extends "base.html" %}
{% block title %}Register | Mini Auction{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Join the community</p><h1>Create an account</h1><p>Sign up to bid on unique finds or list something of your own.</p></div></div>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>First name <input type="text" name="first_name" required maxlength="100" autocomplete="given-name" value="{{ request.form.get('first_name', '') }}"></label>
  <label>Last name <input type="text" name="last_name" required maxlength="100" autocomplete="family-name" value="{{ request.form.get('last_name', '') }}"></label>
  <label>Email <input type="email" name="email" required maxlength="254" autocomplete="email" value="{{ request.form.get('email', '') }}"></label>
  <label>Password (at least 8 characters) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <button type="submit">Create account</button>
</form>{% endblock %}
